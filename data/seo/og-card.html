<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#1a0b2e;overflow:hidden}
  body{position:relative;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#f6e8ff}
  .sky{position:absolute;inset:0;background:
    radial-gradient(ellipse 620px 420px at 1000px 410px, rgba(255,60,172,.30), transparent 70%),
    radial-gradient(ellipse 900px 300px at 1000px 640px, rgba(255,154,60,.22), transparent 70%),
    linear-gradient(180deg,#1a0b2e 0%,#2a1050 62%,#12061f 100%)}
  svg{position:absolute;inset:0}
  .txt{position:absolute;left:84px;top:140px;width:830px}
  .eyebrow{font-weight:700;font-size:23px;letter-spacing:.2em;text-transform:uppercase;color:#ff9a3c}
  h1{margin:20px 0 26px;font-size:92px;white-space:nowrap;line-height:1;font-weight:800;letter-spacing:-.02em;color:#fff;text-shadow:0 0 30px rgba(255,60,172,.55)}
  .tag{font-size:31px;line-height:1.4;color:#c9b0e4;max-width:760px}
  .tag b{color:#f6e8ff;font-weight:600}
  .url{position:absolute;left:84px;bottom:58px;font-size:26px;font-weight:700;letter-spacing:.04em;color:#ff3cac}
  .rule{position:absolute;left:84px;bottom:112px;width:120px;height:4px;border-radius:2px;background:linear-gradient(90deg,#ff3cac,#ff9a3c)}
</style></head><body>
<div class="sky"></div>
<svg width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a3c"/><stop offset=".55" stop-color="#ff3cac"/><stop offset="1" stop-color="#a52bd1"/></linearGradient>
    <clipPath id="above"><rect x="0" y="0" width="1200" height="430"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a0b2e" stop-opacity="1"/><stop offset=".45" stop-color="#1a0b2e" stop-opacity=".92"/><stop offset=".75" stop-color="#1a0b2e" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#above)"><circle cx="1000" cy="345" r="135" fill="url(#sun)"/>
    <g fill="#1a0b2e"><rect x="860" y="350" width="280" height="5"/><rect x="860" y="371" width="280" height="8"/><rect x="860" y="395" width="280" height="11"/><rect x="860" y="421" width="280" height="14"/></g></g>
  <g stroke="#ff3cac" stroke-width="1.3" opacity=".8" fill="none" id="grid"></g>
  <rect x="0" y="0" width="860" height="630" fill="url(#fade)"/>
</svg>
<div class="txt"><div class="eyebrow">Cybersecurity Leader · CISSP-ISSMP</div><h1>Richard Johnson</h1>
<div class="tag">Security programs that turn “Are we secure?” into <b>evidence leadership can act on.</b></div></div>
<div class="rule"></div><div class="url">www.utsec.net</div>
<script>
  // perspective floor: vertical lines converge to the vanishing point, horizontal lines bunch toward the horizon
  const g=document.getElementById('grid'), NS='http://www.w3.org/2000/svg', hy=430, vx=1000;
  const mk=(x1,y1,x2,y2)=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);g.appendChild(l)};
  for(let i=-14;i<=14;i++){ mk(vx+i*14, hy, vx+i*190, 630); }
  for(let k=0;k<9;k++){ const t=Math.pow(k/8,2.1); mk(0, hy+t*200, 1200, hy+t*200); }
</script></body></html>
